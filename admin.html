<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | GG Beauty</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--g:#c9a96e;--gl:#e8d5a3;--bg:#0d0d0f;--card:#1a1618;--txt:#fff;--mut:rgba(255,255,255,0.5)}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:2rem}
    .container{max-width:960px;margin:0 auto}h1,h2{font-family:'Playfair Display',serif;color:var(--g);margin-bottom:1rem}
    .card{background:var(--card);border:1px solid var(--g);padding:1.5rem;border-radius:6px;margin-bottom:1.5rem}
    input,textarea{background:transparent;border:1px solid var(--g);color:var(--txt);padding:.6rem;width:100%;margin:.4rem 0;font-family:inherit;border-radius:4px}
    textarea{min-height:60px;resize:vertical}button{background:var(--g);color:var(--bg);border:none;padding:.7rem 1.2rem;cursor:pointer;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin:.3rem;border-radius:4px;transition:.2s}
    button:hover{background:var(--gl)}button.danger{background:#ef5350;color:#fff}button.ghost{background:transparent;border:1px solid var(--g);color:var(--g)}
    .row{display:grid;grid-template-columns:2fr .8fr .8fr 2fr .5fr;gap:.5rem;align-items:center;margin-bottom:.5rem;padding-bottom:.5rem;border-bottom:1px solid rgba(255,255,255,0.08)}
    .row.header{font-weight:600;color:var(--mut);font-size:.8rem;text-transform:uppercase}.hidden{display:none!important}
    @media(max-width:768px){.row{grid-template-columns:1fr;gap:.8rem}.row.header{display:none}}
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Panel de Administración | GG Beauty</h1>
    <div id="login-form" class="card">
      <h2>🔐 Conexión segura</h2>
      <input type="password" id="token" placeholder="GitHub Personal Access Token">
      <input type="text" id="owner" placeholder="Usuario/Organización GitHub">
      <input type="text" id="repo" placeholder="Nombre del repositorio">
      <input type="text" id="branch" value="main" placeholder="Rama (main)">
      <button onclick="connect()">🔗 Conectar</button>
      <p style="color:var(--mut);font-size:.8rem;margin-top:1rem">
        Genera tu token en <a href="https://github.com/settings/tokens" target="_blank" style="color:var(--g)">github.com/settings/tokens</a><br>
        Permiso necesario: <code>Contents: Read & write</code>
      </p>
    </div>
    <div id="dashboard" class="hidden">
      <div id="status"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <h2>📋 Servicios</h2>
        <button onclick="addCategory()">+ Nueva Categoría</button>
      </div>
      <div id="categories"></div>
      <button onclick="publish()" style="width:100%;margin-top:1.5rem;padding:1rem;font-size:1rem">🚀 Guardar y Publicar</button>
    </div>
  </div>
  <script>
    let cfg={},file={};const $=id=>document.getElementById(id);
    async function connect(){cfg={token:$('token').value.trim(),owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main'};if(!cfg.token||!cfg.owner||!cfg.repo)return alert('Completa todos los campos');localStorage.setItem('adm_cfg',JSON.stringify(cfg));await loadData()}
    async function loadData(){$('login-form').classList.add('hidden');$('dashboard').classList.remove('hidden');try{const res=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data/servicios.json?ref=${cfg.branch}`);if(!res.ok)throw new Error('Archivo no encontrado o sin permisos');const json=await res.json();file.sha=json.sha;file.data=JSON.parse(atob(json.content));render();msg('✅ Datos cargados','success')}catch(e){msg('❌ '+e.message,'error')}}
    function render(){const c=$('categories');c.innerHTML='';file.data.categorias.forEach((cat,ci)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><input type="text" value="${cat.titulo}" onchange="file.data.categorias[${ci}].titulo=this.value" style="width:70%;font-weight:600;font-size:1.1rem"><div><button class="ghost" onclick="addService(${ci})">+ Servicio</button><button class="danger" onclick="delCat(${ci})">🗑️</button></div></div><div class="row header"><span>Nombre</span><span>Precio</span><span>Duración</span><span>Descripción</span><span></span></div>${cat.servicios.map((s,si)=>`<div class="row"><input value="${s.nombre}" onchange="file.data.categorias[${ci}].servicios[${si}].nombre=this.value"><input value="${s.precio}" onchange="file.data.categorias[${ci}].servicios[${si}].precio=this.value"><input value="${s.duracion}" onchange="file.data.categorias[${ci}].servicios[${si}].duracion=this.value"><textarea onchange="file.data.categorias[${ci}].servicios[${si}].descripcion=this.value">${s.descripcion}</textarea><button class="danger" onclick="delServ(${ci},${si})">✕</button></div>`).join('')}`;c.appendChild(d)})}
    window.addCategory=()=>{file.data.categorias.push({titulo:'Nueva Categoría',servicios:[]});render()};window.addService=ci=>{file.data.categorias[ci].servicios.push({nombre:'Nuevo',precio:'0',duracion:'0 min',descripcion:''});render()};window.delCat=ci=>{if(confirm('¿Eliminar categoría?')){file.data.categorias.splice(ci,1);render()}};window.delServ=(ci,si)=>{file.data.categorias[ci].servicios.splice(si,1);render()};
    async function publish(){const btn=document.querySelector('button[onclick="publish()"]');btn.textContent='⏳ Publicando...';btn.disabled=true;try{const content=btoa(JSON.stringify(file.data,null,2));const res=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data/servicios.json`,{method:'PUT',headers:{'Authorization':`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'🤖 Actualización desde Panel Admin',content,sha:file.sha,branch:cfg.branch})});if(!res.ok)throw new Error('Error al guardar');const updated=await res.json();file.sha=updated.content.sha;msg('✅ ¡Publicado! Vercel está desplegando (~30s)','success')}catch(e){msg('❌ '+e.message,'error')}btn.textContent='🚀 Guardar y Publicar';btn.disabled=false}
    function msg(t,c){$('status').className=`status ${c}`;$('status').textContent=t;document.querySelectorAll('.status').forEach(s=>{s.style.padding='.8rem';s.style.borderRadius='4px';s.style.marginBottom='1rem';s.style.fontSize='.9rem'});if(c==='success'){document.getElementById('status').style.background='rgba(76,175,80,0.15)';document.getElementById('status').style.color='#81c784';document.getElementById('status').style.border='1px solid #4caf50'}else{document.getElementById('status').style.background='rgba(244,67,54,0.15)';document.getElementById('status').style.color='#ef9a9a';document.getElementById('status').style.border='1px solid #f44336'}}
    const saved=localStorage.getItem('adm_cfg');if(saved){cfg=JSON.parse(saved);$('token').value=cfg.token;$('owner').value=cfg.owner;$('repo').value=cfg.repo;$('branch').value=cfg.branch;connect()}
  </script>
</body>
</html>
