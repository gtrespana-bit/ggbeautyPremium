<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Beauty — Panel de Administración</title>
    <style>
        :root {
            --gold: #c9a96e;
            --gold-hover: #e8d5a3;
            --dark: #0d0d0f;
            --card: #1a1618;
            --input-bg: #2a2629;
            --text: #f5f1ed;
            --border: rgba(201, 169, 110, 0.2);
            --success: #2ecc71;
            --error: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--dark); color: var(--text); line-height: 1.5; padding: 2rem; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { color: var(--gold); margin-bottom: 0.5rem; font-size: 2rem; }
        .subtitle { opacity: 0.7; margin-bottom: 2rem; }
        
        .config-panel {
            background: var(--card); padding: 1.5rem; border-radius: 10px;
            margin-bottom: 2rem; border: 1px solid var(--border);
        }
        .input-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem; margin-bottom: 1rem;
        }
        label { display: block; font-size: 0.8rem; color: var(--gold); margin-bottom: 0.3rem; }
        input, textarea, select {
            width: 100%; padding: 0.8rem; background: var(--input-bg);
            border: 1px solid var(--border); color: var(--text);
            border-radius: 6px; font-size: 0.9rem; transition: 0.2s;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--gold); }
        textarea { min-height: 70px; resize: vertical; }
        
        button {
            padding: 0.8rem 1.5rem; background: var(--gold); color: var(--dark);
            border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: 0.2s; font-size: 0.9rem;
        }
        button:hover { background: var(--gold-hover); }
        button.secondary { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        button.secondary:hover { background: rgba(201,169,110,0.1); }
        button.danger { background: var(--error); color: white; }
        button.danger:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .status {
            padding: 1rem; margin-top: 1rem; border-radius: 6px;
            text-align: center; font-weight: 500; display: none;
        }
        .status.success { background: rgba(46,204,113,0.15); color: var(--success); border: 1px solid var(--success); display: block; }
        .status.error { background: rgba(231,76,60,0.15); color: var(--error); border: 1px solid var(--error); display: block; }
        
        .category {
            background: var(--card); padding: 1.5rem; border-radius: 10px;
            margin-bottom: 1.5rem; border: 1px solid var(--border);
        }
        .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-bottom: 0.8rem; }
        .lang-label { font-size: 0.75rem; color: var(--gold); margin-bottom: 0.2rem; display: flex; align-items: center; gap: 4px; }
        
        .service {
            background: rgba(255,255,255,0.03); padding: 1rem; margin: 1rem 0;
            border-radius: 8px; border-left: 3px solid var(--gold); position: relative;
        }
        .svc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
        .svc-title { font-weight: 600; color: var(--gold); }
        .actions { display: flex; gap: 0.5rem; }
        
        @media (max-width: 768px) {
            .lang-grid { grid-template-columns: 1fr; }
            body { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Panel de Administración</h1>
        <p class="subtitle">Gestiona servicios, categorías y traducciones (ES/EN/DE) para GG Beauty Aesthetics</p>

        <!-- Configuración GitHub -->
        <div class="config-panel">
            <h3 style="margin-bottom:1rem;">⚙️ Conexión con GitHub</h3>
            <div class="input-grid">
                <div><label>Token PAT (Clásico)</label><input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx"></div>
                <div><label>Owner / Usuario</label><input type="text" id="ghOwner" placeholder="tu-usuario"></div>
                <div><label>Repositorio</label><input type="text" id="ghRepo" placeholder="nombre-repo"></div>
                <div><label>Rama</label><input type="text" id="ghBranch" value="main"></div>
            </div>
            <div style="display:flex; gap:0.8rem; flex-wrap:wrap;">
                <button onclick="loadData()" id="btnLoad">📥 Cargar Datos</button>
                <button class="secondary" onclick="saveData()" id="btnSave" disabled>💾 Guardar en GitHub</button>
            </div>
        </div>

        <div id="status" class="status"></div>
        <div id="categoriesContainer"></div>
        
        <button onclick="addCategory()" style="width:100%; margin-top:2rem; padding:1rem;">➕ Añadir Nueva Categoría</button>
    </div>

    <script>
        let appData = { categorias: [] };
        let currentSha = '';

        function showMsg(msg, type = 'success') {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = `status ${type}`;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 4000);
        }

        function getConfig() {
            return {
                token: document.getElementById('ghToken').value.trim(),
                owner: document.getElementById('ghOwner').value.trim(),
                repo: document.getElementById('ghRepo').value.trim(),
                branch: document.getElementById('ghBranch').value.trim() || 'main'
            };
        }

        async function loadData() {
            const c = getConfig();
            if (!c.token || !c.owner || !c.repo) return showMsg('❌ Completa Token, Owner y Repo', 'error');
            
            document.getElementById('btnLoad').disabled = true;
            document.getElementById('btnLoad').textContent = '⏳ Cargando...';
            showMsg('⏳ Conectando con GitHub...');

            try {
                const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/data/servicios.json?ref=${c.branch}`;
                const res = await fetch(url, { headers: { 'Authorization': `token ${c.token}` } });
                if (!res.ok) throw new Error('Error 404: Verifica Owner, Repo o Token');
                
                const data = await res.json();
                currentSha = data.sha;
                // Decodificar UTF-8 correctamente
                const decoded = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                appData = decoded;
                
                renderCategories();
                document.getElementById('btnSave').disabled = false;
                showMsg('✅ Datos cargados correctamente. Puedes editar ahora.');
            } catch (e) {
                showMsg('❌ ' + e.message, 'error');
            } finally {
                document.getElementById('btnLoad').disabled = false;
                document.getElementById('btnLoad').textContent = '📥 Cargar Datos';
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';
            
            appData.categorias.forEach((cat, cIdx) => {
                const catEl = document.createElement('div');
                catEl.className = 'category';
                catEl.innerHTML = `
                    <div class="cat-header">
                        <h3 style="color:var(--gold);">📂 Categoría #${cIdx + 1}</h3>
                        <div class="actions">
                            <button class="secondary" onclick="addService(${cIdx})" style="padding:0.4rem 0.8rem; font-size:0.8rem;">➕ Servicio</button>
                            <button class="danger" onclick="deleteCategory(${cIdx})" style="padding:0.4rem 0.8rem; font-size:0.8rem;">🗑️</button>
                        </div>
                    </div>
                    <div class="lang-grid">
                        <div><div class="lang-label">🇪🇸 Título ES</div><input value="${cat.titulo.es || ''}" onchange="updateCatField(${cIdx}, 'titulo', 'es', this.value)"></div>
                        <div><div class="lang-label">🇬 Título EN</div><input value="${cat.titulo.en || ''}" onchange="updateCatField(${cIdx}, 'titulo', 'en', this.value)"></div>
                        <div><div class="lang-label">🇩🇪 Título DE</div><input value="${cat.titulo.de || ''}" onchange="updateCatField(${cIdx}, 'titulo', 'de', this.value)"></div>
                    </div>
                    <div id="svc-list-${cIdx}"></div>
                `;
                container.appendChild(catEl);
                renderServices(cIdx);
            });
        }

        function renderServices(cIdx) {
            const container = document.getElementById(`svc-list-${cIdx}`);
            container.innerHTML = '';
            appData.categorias[cIdx].servicios.forEach((svc, sIdx) => {
                const svcEl = document.createElement('div');
                svcEl.className = 'service';
                svcEl.innerHTML = `
                    <div class="svc-header">
                        <span class="svc-title">🔹 Servicio #${sIdx + 1}</span>
                        <button class="danger" onclick="deleteService(${cIdx}, ${sIdx})" style="padding:0.3rem 0.6rem; font-size:0.7rem;">🗑️</button>
                    </div>
                    <div class="lang-grid">
                        <div><div class="lang-label">🇪 Nombre ES</div><input value="${svc.nombre.es || ''}" onchange="updateSvcField(${cIdx}, ${sIdx}, 'nombre', 'es', this.value)"></div>
                        <div><div class="lang-label">🇬🇧 Nombre EN</div><input value="${svc.nombre.en || ''}" onchange="updateSvcField(${cIdx}, ${sIdx}, 'nombre', 'en', this.value)"></div>
                        <div><div class="lang-label">🇩🇪 Nombre DE</div><input value="${svc.nombre.de || ''}" onchange="updateSvcField(${cIdx}, ${sIdx}, 'nombre', 'de', this.value)"></div>
                    </div>
                    <div class="lang-grid" style="margin-bottom:0.8rem;">
                        <div><div class="lang-label">🇪🇸 Descripción ES</div><textarea onchange="updateSvcField(${cIdx}, ${sIdx}, 'descripcion', 'es', this.value)">${svc.descripcion.es || ''}</textarea></div>
                        <div><div class="lang-label">🇬🇧 Descripción EN</div><textarea onchange="updateSvcField(${cIdx}, ${sIdx}, 'descripcion', 'en', this.value)">${svc.descripcion.en || ''}</textarea></div>
                        <div><div class="lang-label">🇩🇪 Descripción DE</div><textarea onchange="updateSvcField(${cIdx}, ${sIdx}, 'descripcion', 'de', this.value)">${svc.descripcion.de || ''}</textarea></div>
                    </div>
                    <div class="input-grid">
                        <div><label>Precio (€)</label><input type="text" value="${svc.precio || ''}" placeholder="Ej: 45" onchange="updateSvcField(${cIdx}, ${sIdx}, 'precio', null, this.value)"></div>
                        <div><label>Duración</label><input type="text" value="${svc.duracion || ''}" placeholder="Ej: 45 min" onchange="updateSvcField(${cIdx}, ${sIdx}, 'duracion', null, this.value)"></div>
                    </div>
                `;
                container.appendChild(svcEl);
            });
        }

        // Update Handlers
        function updateCatField(cIdx, field, lang, val) {
            appData.categorias[cIdx][field][lang] = val;
        }
        function updateSvcField(cIdx, sIdx, field, lang, val) {
            if (lang) {
                if (!appData.categorias[cIdx].servicios[sIdx][field]) appData.categorias[cIdx].servicios[sIdx][field] = {};
                appData.categorias[cIdx].servicios[sIdx][field][lang] = val;
            } else {
                appData.categorias[cIdx].servicios[sIdx][field] = val;
            }
        }

        // CRUD Operations
        function addCategory() {
            appData.categorias.push({ titulo: { es: 'Nueva Categoría', en: 'New Category', de: 'Neue Kategorie' }, servicios: [] });
            renderCategories();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
        function addService(cIdx) {
            appData.categorias[cIdx].servicios.push({
                nombre: { es: '', en: '', de: '' },
                descripcion: { es: '', en: '', de: '' },
                precio: '', duracion: ''
            });
            renderServices(cIdx);
        }
        function deleteCategory(cIdx) {
            if (confirm('¿Eliminar esta categoría y todos sus servicios?')) {
                appData.categorias.splice(cIdx, 1);
                renderCategories();
            }
        }
        function deleteService(cIdx, sIdx) {
            appData.categorias[cIdx].servicios.splice(sIdx, 1);
            renderServices(cIdx);
        }

        // Save to GitHub
        async function saveData() {
            const c = getConfig();
            if (!c.token || !c.owner || !c.repo) return showMsg('❌ Configura GitHub primero', 'error');
            
            document.getElementById('btnSave').disabled = true;
            document.getElementById('btnSave').textContent = '⏳ Guardando...';
            showMsg('⏳ Enviando cambios a GitHub...');

            try {
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(appData, null, 2))));
                const res = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/data/servicios.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${c.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: '🤖 Actualización desde Panel Admin - ' + new Date().toLocaleString(),
                        content: content,
                        sha: currentSha,
                        branch: c.branch
                    })
                });
                
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'Error al guardar');
                }
                
                const resp = await res.json();
                currentSha = resp.content.sha;
                showMsg('✅ ¡Guardado con éxito! Vercel redeployará automáticamente en ~30s.');
            } catch (e) {
                showMsg('❌ ' + e.message, 'error');
            } finally {
                document.getElementById('btnSave').disabled = false;
                document.getElementById('btnSave').textContent = '💾 Guardar en GitHub';
            }
        }
    </script>
</body>
</html>
